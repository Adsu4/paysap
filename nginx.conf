# First-boot configuration: works BEFORE a certificate exists.
# Replace server_name with your actual domain(s), copy to sites-available/paysap,
# enable it, then run certbot --nginx --redirect for those same names.
# Certbot adds the HTTPS listener/certificate and HTTP redirect after validation.
limit_req_zone $binary_remote_addr zone=paysap_api:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=paysap_auth:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name paysap.me www.paysap.me;
    client_max_body_size 12M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This setup has exactly one public proxy. Overwrite untrusted incoming values.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/auth/ {
        limit_req zone=paysap_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        limit_req zone=paysap_api burst=35 nodelay;
        limit_req_status 429;
        # Express serves assets from the checkout, avoiding path mismatches and
        # stale unversioned JavaScript cached for a month.
        proxy_pass http://127.0.0.1:3000;
    }
}

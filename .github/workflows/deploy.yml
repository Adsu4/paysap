name: PaySap verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile local styles
        run: npm run build
      - name: Check committed production CSS is current
        run: git diff --exit-code -- public/css/tailwind.css
      - name: Verify isolated security, feature and regression suite
        run: npm test
      - name: Validate backup shell syntax
        run: bash -n scripts/backup.sh

# Deployment stays manual until the real host, secrets, backup target and rollback
# procedure are configured. See DEPLOYMENT.md. A green test result must never imply
# that an unconfigured production deployment succeeded.
